title: IPv4 / CIDR Iterator
title_zh: IPv4 / CIDR 迭代器
summary: 'An iterator over IP addresses in six parts: forward, reverse, confined to a CIDR block, with a step size, with batch reads, and finally IPv6 with canonical formatting, rejecting malformed input with ValueError.'
