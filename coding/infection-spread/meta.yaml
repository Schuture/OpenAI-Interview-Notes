title: Infection Spread (Grid Cellular Automaton)
title_zh: 感染扩散（网格元胞自动机）
summary: 'A grid infection spreads one step per day and every part adds a rule: immune walls, recovery after D days, neighbour thresholds and deaths. Multi-source BFS first, then a synchronous simulation.'
