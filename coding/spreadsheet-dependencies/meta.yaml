title: Spreadsheet with Cell Dependencies (OpenSheet)
title_zh: 带单元格依赖的电子表格（OpenSheet）
summary: Cells hold numbers or formulas over other cells. Evaluate on demand with cycle detection first, then keep values fresh eagerly through a dependency graph so that reads become constant time.
