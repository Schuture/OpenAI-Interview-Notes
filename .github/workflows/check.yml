name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies (CPU-only PyTorch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Generated tables are up to date
        run: python scripts/build_index.py --check
      - name: Both languages match, links and anchors resolve
        run: python scripts/check_i18n.py
      - name: Markdown renders on GitHub
        run: python scripts/check_render.py
      - name: Run the code of every page under two hash seeds
        run: python scripts/run_snippets.py --all --strict --hash-seeds
