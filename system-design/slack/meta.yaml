title: Slack-style Messaging
title_zh: 类 Slack 即时通讯
summary: Direct messages and channels delivered to every connected device of each user, with notifications, deletes, per-channel ordering and reconnect gap-fill, workspace isolation, and a separate delivery mode for very large channels.
