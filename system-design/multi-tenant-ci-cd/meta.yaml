title: Multi-Tenant CI/CD
title_zh: 多租户 CI/CD
summary: 'Run a workflow DAG on every git push for many tenants: jobs execute at least once but commit their result exactly once, tenants are isolated and fairly scheduled, and the UI shows live status.'
